<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — TikLive Studio</title>
<style>
  :root { --bg:#0b0c11; --panel:#161925; --panel2:#1f2230; --line:#2a2e3f; --text:#eef0f7; --muted:#9196ad; --pink:#fe2c55; --cyan:#25f4ee; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(closest-side at 30% 20%, rgba(254,44,85,.18), transparent 70%), radial-gradient(closest-side at 80% 70%, rgba(37,244,238,.12), transparent 70%), var(--bg); color: var(--text); font: 16px/1.5 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; padding: 20px; }
  .box { width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 30px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .logo { font-weight: 800; font-size: 22px; margin-bottom: 4px; } .logo b { color: var(--cyan); } .logo span { color: var(--pink); }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel2); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
  .tabs a { text-align: center; padding: 8px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; }
  .tabs a.on { background: var(--panel); color: var(--text); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  input { width: 100%; margin-top: 5px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit; }
  input:focus { outline: 2px solid var(--cyan); outline-offset: -1px; }
  button { width: 100%; padding: 13px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--pink), #ff5f7e); color: #fff; font: inherit; font-weight: 700; cursor: pointer; margin-top: 6px; }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: #ff6b81; font-size: 14px; min-height: 20px; margin-top: 10px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 16px; text-align: center; }
  .note a { color: var(--cyan); }
  .ok { color: #2bd67b; font-size: 14px; }
  .forgot { text-align: center; margin: 14px 0 0; font-size: 14px; } .forgot a { color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main class="box">
  <div class="logo"><span>◆</span> TikLive <b>Studio</b></div>
  <p class="sub" id="sub">Интерактивные эфиры TikTok LIVE — прямо в браузере.</p>
  <div class="tabs"><a href="/login" id="tLogin">Вход</a><a href="/signup" id="tSignup">Регистрация</a></div>
  <form id="form">
    <label id="emailField">E-mail<input name="email" type="email" autocomplete="email" required></label>
    <label id="passField">Пароль<input name="password" type="password" minlength="8" required></label>
    <button id="btn">Войти</button>
    <div class="err" id="err" role="alert"></div>
    <div class="ok" id="ok" role="status"></div>
    <p class="forgot" id="forgotLink"><a href="/forgot">Забыли пароль?</a></p>
  </form>
  <p class="note" id="note">Без логина и пароля от TikTok — только ник стримера.<br>Первые 7 дней Pro бесплатно, без карты.</p>
</main>
<script>
  // One page, four modes: /login, /signup, /forgot (request a link), /reset?token=… (set a new password).
  const mode = location.pathname.slice(1);
  const resetToken = new URLSearchParams(location.search).get('token') || '';
  const $ = (id) => document.getElementById(id);
  const pass = document.querySelector('[name=password]');
  const MODES = {
    login: { tab: 'tLogin', button: 'Войти', url: '/auth/login', autocomplete: 'current-password' },
    signup: { tab: 'tSignup', button: 'Создать аккаунт', url: '/auth/signup', autocomplete: 'new-password' },
    forgot: { button: 'Отправить ссылку', url: '/auth/forgot', sub: 'Введите e-mail аккаунта — пришлём ссылку для сброса пароля.' },
    reset: { button: 'Сохранить пароль', url: '/auth/reset', autocomplete: 'new-password', sub: 'Придумайте новый пароль (не короче 8 символов).' },
  };
  const m = MODES[mode] || MODES.login;
  if (m.tab) $(m.tab).classList.add('on');
  else document.querySelector('.tabs').classList.add('hidden');
  if (m.sub) $('sub').textContent = m.sub;
  $('btn').textContent = m.button;
  if (mode === 'forgot') { $('passField').remove(); }
  if (mode === 'reset') { $('emailField').remove(); pass.placeholder = 'новый пароль'; }
  if (mode !== 'login') $('forgotLink').classList.add('hidden');
  if (mode === 'forgot' || mode === 'reset') $('note').innerHTML = '<a href="/login">← Вернуться ко входу</a>';
  if (pass?.isConnected) pass.autocomplete = m.autocomplete;
  if (mode === 'signup') pass.placeholder = 'не короче 8 символов';
  if (mode === 'reset' && !resetToken) $('err').textContent = 'В ссылке нет кода сброса. Запросите новую ссылку.';
  const q = new URLSearchParams(location.search);
  if (q.has('verified')) $('ok').textContent = '✅ E-mail подтверждён. Войдите в аккаунт.';
  if (q.get('verify_error')) $('err').textContent = q.get('verify_error');

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('err').textContent = '';
    $('ok').textContent = '';
    $('btn').disabled = true;
    try {
      const body = Object.fromEntries(new FormData(e.target));
      if (mode === 'reset') body.token = resetToken;
      const res = await fetch(m.url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Ошибка');
      if (mode === 'forgot') {
        $('ok').textContent = data.message;
        return;
      }
      location.href = '/app';
    } catch (ex) {
      $('err').textContent = ex.message;
    } finally {
      $('btn').disabled = false;
    }
  });
</script>
</body>
</html>
